<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline Multilingual Language Translator</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <span>🌐 IndicTranslate</span>
      <span class="badge">100% Offline</span>
    </div>
    <div class="header-actions">
      <a href="/gradio" class="icon-btn" title="Open Gradio Developer UI" style="text-decoration: none; font-size: 0.9rem; font-weight: 600; padding: 0.5rem 0.8rem; gap: 0.3rem;">
        🧪 Gradio
      </a>
      <button id="historyToggleBtn" class="icon-btn" title="Translation History">📜</button>
      <button id="themeToggleBtn" class="icon-btn" title="Toggle Light/Dark Theme">🌙</button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main>
    <div class="translator-wrapper">
      
      <!-- Script Warning Banner -->
      <div id="warningBanner" class="warning-banner"></div>

      <!-- Language Selection Controls -->
      <div class="controls-bar">
        <div class="lang-select-group">
          <select id="srcLang" class="lang-select" aria-label="Source Language"></select>
          <button id="swapBtn" class="swap-btn" title="Swap languages">⇄</button>
          <select id="tgtLang" class="lang-select" aria-label="Target Language"></select>
        </div>
      </div>

      <!-- Side-by-Side Translation Panes -->
      <div class="panes-grid">
        <!-- Source Input Pane -->
        <div class="pane source-pane">
          <textarea
            id="srcInput"
            class="trans-input"
            placeholder="Type or paste text here... (Kannada, Hindi, Tamil, Telugu, Malayalam, English, Spanish)"
            autofocus
            spellcheck="false"
          ></textarea>
          <div class="pane-footer">
            <span class="char-counter"><span id="charCount">0</span> chars</span>
            <div class="pane-actions">
              <button id="clearBtn" class="action-btn" title="Clear text">✕ Clear</button>
            </div>
          </div>
        </div>

        <!-- Target Output Pane -->
        <div class="pane target-pane">
          <div id="tgtOutput" class="trans-output placeholder">Translation will appear here...</div>
          <div class="pane-footer">
            <div id="tgtMeta"></div>
            <div class="pane-actions">
              <button id="copyBtn" class="action-btn" title="Copy translation to clipboard">📋 Copy</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Live Performance Status Bar -->
      <div id="statusBar" class="status-bar">
        <span>Offline Engine Ready (CTranslate2 INT8).</span>
        <span>Zero Network Required</span>
      </div>
    </div>

    <!-- Offline Lexicon & Dictionary Card -->
    <div id="dictCard" class="dictionary-card">
      <h3>
        📖 <span id="dictWord"></span>
        <span id="dictPos" class="dict-pos"></span>
      </h3>
      <div id="dictDef" class="dict-def"></div>
      <div class="dict-meta">
        <div>
          <strong>Synonyms:</strong>
          <div id="dictSynonyms" class="badge-list" style="margin-top: 0.25rem;"></div>
        </div>
        <div>
          <strong>Antonyms:</strong>
          <div id="dictAntonyms" class="badge-list" style="margin-top: 0.25rem;"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Slide-out History Drawer -->
  <aside id="historyDrawer" class="history-drawer">
    <div class="drawer-header">
      <h3 style="font-size: 1.1rem;">📜 Translation History</h3>
      <div style="display: flex; gap: 0.5rem;">
        <button id="clearHistoryBtn" class="icon-btn" title="Clear all history" style="font-size: 0.8rem; padding: 0.3rem 0.6rem;">Clear</button>
        <button id="closeDrawerBtn" class="icon-btn" title="Close drawer">✕</button>
      </div>
    </div>
    <div id="historyList" class="history-list"></div>
  </aside>

  <!-- Toast Notification -->
  <div id="toast" class="toast">Copied to clipboard!</div>

  <script src="/static/js/app.js"></script>
</body>
</html>
